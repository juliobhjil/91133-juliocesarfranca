<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>controle de estoque 1.0 - SENAI FSA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> Controle de Estoque 1.0 - SENAI FSA</h1>

    <form method="post" action="api/api.php" onsubmit="return validarFormulario()">
          <label for="produto">Produto:</label>
          <input type="text" id="produto" name="produto">

          <label for="tipo">Tipo:</label>
          <select id="tipo" name="tipo">
            <option value="">Selecione</option>
            <option value="Alimento">Alimento</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Eletronico">Eletronico</option>
            <option value="Vestuario">Vestuario</option>
            
          </select>

          <label for="quantidade">Quantidade:</label>
          <input type="number" id="quantidade" name="quantidade" min="1">

          <button type="submit">Cadastrar</button>

     </form>

     <div>
        <button class="btn"><a href= "http://localhost:8081/APP/view/listar.php">Listar produtos</a> </button><br>
        <br> <button class="btn"> <a href="http://localhost:8081/APP/">Voltar</a></button>
     </div>

     <script src="script.js"></script>
    
</body>
</html>
